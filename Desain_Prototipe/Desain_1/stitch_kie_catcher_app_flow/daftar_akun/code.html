<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    name="viewport">
  <style>
    @layer base {

      html,
      body {
        width: 100vw;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      body {
        overscroll-behavior: none;
      }

      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;family=Space+Grotesk:wght@500;600&amp;display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script
    id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface": "#f8f9ff", "background": "#f8f9ff", "text-body": "#475569", "on-tertiary-fixed": "#07006c", "warning-amber": "#F59E0B", "surface-container-highest": "#d3e4fe", "surface-bright": "#f8f9ff", "bg-subtle": "#F8FAFC", "outline-variant": "#c4c5d5", "secondary-container": "#6cf8bb", "on-tertiary-fixed-variant": "#2f2ebe", "tertiary-fixed": "#e1e0ff", "surface-container-lowest": "#ffffff", "inverse-surface": "#213145", "on-primary-fixed-variant": "#173bab", "text-heading": "#0F172A", "primary-fixed": "#dde1ff", "inverse-primary": "#b8c4ff", "surface-variant": "#d3e4fe", "on-secondary-fixed-variant": "#005236", "tertiary": "#170cae", "surface-tint": "#3755c3", "secondary-fixed": "#6ffbbe", "on-error": "#ffffff", "on-error-container": "#93000a", "surface-container": "#e5eeff", "on-surface": "#0b1c30", "on-primary": "#ffffff", "surface-card": "#FFFFFF", "on-background": "#0b1c30", "surface-dim": "#cbdbf5", "tertiary-fixed-dim": "#c0c1ff", "primary": "#00288e", "secondary": "#006c49", "inverse-on-surface": "#eaf1ff", "error": "#ba1a1a", "on-secondary": "#ffffff", "primary-container": "#1e40af", "on-secondary-fixed": "#002113", "surface-container-low": "#eff4ff", "surface-container-high": "#dce9ff", "on-primary-container": "#a8b8ff", "on-tertiary-container": "#b3b5ff" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "16px", "xs": "4px", "base": "4px", "lg": "24px", "margin-desktop": "32px", "md": "16px", "xl": "32px", "sm": "8px", "margin-mobile": "16px" }, "fontFamily": { "body-md": ["Inter"], "label-sm": ["Space Grotesk"], "headline-lg-mobile": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "body-lg": ["Inter"], "label-md": ["Space Grotesk"] }, "fontSize": { "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }], "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500" }] } } } }</script>
</head>

<body class="bg-background font-body-md text-text-body pt-safe pb-safe">
  <main class="flex flex-col min-h-screen relative w-full">
    <div class="flex flex-col w-full h-full min-h-[100dvh] bg-surface relative items-center justify-center p-6">
      <div
        class="w-full max-w-md bg-surface-card rounded-2xl shadow-xl overflow-hidden relative z-10 flex flex-col p-8 md:p-10">
        <div class="flex justify-center mb-8">
          <img alt="Kie Catcher Logo" class="h-16 w-16 object-contain"
            src="https://lh3.googleusercontent.com/aida/AEtjO1VIQyv-A6-etisnbpEGCuLFVYwgQQrFgJy2nbn3tbOL9udPLoIJOwFW1MQGrU8_wznbY1bWjdnibL8_xDCeTYvq3QxR22d1BhsL4ui3Aaxi_gI-UOZqMSqp8_vsy32WO0B2KUxTKgwG-UsGca-bXTAKaHmWJ4-K58MSuO6JGpZCOH3o7CtYtTcgy4Ys5-mOg0V0Ha4DTrFIdMKiBHpEEbo_AXG4i_lk6KlADFrZP2hY748BpOOaapIIZQ">
        </div>
        <div class="text-center mb-8">
          <h1 class="text-headline-lg-mobile md:text-headline-lg text-text-heading mb-2">Daftar Akun Baru</h1>
          <p class="text-body-md text-text-body">Mulai kumpulkan saldo dengan setor API Key sekarang.</p>
        </div>
        <form class="flex flex-col space-y-5">
          <div class="flex flex-col space-y-1.5">
            <label class="text-label-md text-text-heading" for="fullName">Nama Lengkap</label>
            <div
              class="relative flex items-center bg-surface-container-low rounded-xl px-4 py-3 shadow-sm transition-shadow focus-within:ring-2 focus-within:ring-primary focus-within:ring-opacity-50">
              <span class="material-symbols-outlined text-outline-variant mr-3 text-[20px]">person</span>
              <input
                class="w-full bg-transparent border-none outline-none text-body-md text-on-surface placeholder:text-outline-variant"
                id="fullName" placeholder="Masukkan nama lengkap" type="text">
            </div>
          </div>
          <div class="flex flex-col space-y-1.5">
            <label class="text-label-md text-text-heading" for="email">Email</label>
            <div
              class="relative flex items-center bg-surface-container-low rounded-xl px-4 py-3 shadow-sm transition-shadow focus-within:ring-2 focus-within:ring-primary focus-within:ring-opacity-50">
              <span class="material-symbols-outlined text-outline-variant mr-3 text-[20px]">mail</span>
              <input
                class="w-full bg-transparent border-none outline-none text-body-md text-on-surface placeholder:text-outline-variant"
                id="email" placeholder="contoh@email.com" type="email">
            </div>
          </div>
          <div class="flex flex-col space-y-1.5">
            <label class="text-label-md text-text-heading" for="password">Kata Sandi</label>
            <div
              class="relative flex items-center bg-surface-container-low rounded-xl px-4 py-3 shadow-sm transition-shadow focus-within:ring-2 focus-within:ring-primary focus-within:ring-opacity-50">
              <span class="material-symbols-outlined text-outline-variant mr-3 text-[20px]">lock</span>
              <input
                class="w-full bg-transparent border-none outline-none text-body-md text-on-surface placeholder:text-outline-variant"
                id="password" placeholder="Minimal 8 karakter" type="password">
              <button class="ml-3 text-outline-variant hover:text-primary transition-colors focus:outline-none"
                onclick="togglePassword('password', this)" type="button">
                <span class="material-symbols-outlined text-[20px]">visibility_off</span>
              </button>
            </div>
          </div>
          <div class="flex flex-col space-y-1.5">
            <label class="text-label-md text-text-heading" for="confirmPassword">Konfirmasi Kata Sandi</label>
            <div
              class="relative flex items-center bg-surface-container-low rounded-xl px-4 py-3 shadow-sm transition-shadow focus-within:ring-2 focus-within:ring-primary focus-within:ring-opacity-50">
              <span class="material-symbols-outlined text-outline-variant mr-3 text-[20px]">lock_reset</span>
              <input
                class="w-full bg-transparent border-none outline-none text-body-md text-on-surface placeholder:text-outline-variant"
                id="confirmPassword" placeholder="Ulangi kata sandi" type="password">
              <button class="ml-3 text-outline-variant hover:text-primary transition-colors focus:outline-none"
                onclick="togglePassword('confirmPassword', this)" type="button">
                <span class="material-symbols-outlined text-[20px]">visibility_off</span>
              </button>
            </div>
          </div>
          <div class="flex items-start mt-2">
            <div class="flex items-center h-5">
              <input
                class="w-4 h-4 rounded text-primary bg-surface-container-lowest border-outline-variant focus:ring-primary focus:ring-2 focus:ring-opacity-50"
                id="terms" type="checkbox">
            </div>
            <div class="ml-3 text-sm">
              <label class="font-body-md text-text-body text-[14px]" for="terms">Saya setuju dengan <a
                  class="text-primary hover:underline font-medium" href="#">Syarat dan Ketentuan</a>.</label>
            </div>
          </div>
          <button
            class="w-full mt-6 bg-primary text-on-primary font-headline-md text-[16px] py-4 rounded-xl shadow-md hover:bg-primary-container transition-colors active:scale-[0.98]"
            type="submit">
            Daftar Sekarang
          </button>
        </form>
        <div class="relative flex items-center py-6 mt-2">
          <div class="flex-grow border-t border-outline-variant/30"></div>
          <span class="flex-shrink-0 mx-4 text-label-sm text-outline-variant tracking-wider uppercase">ATAU DAFTAR
            DENGAN</span>
          <div class="flex-grow border-t border-outline-variant/30"></div>
        </div>
        <div class="flex flex-col space-y-3">
          <button
            class="w-full flex items-center justify-center bg-surface-container-lowest border border-outline-variant/30 text-on-surface font-body-md font-medium text-[15px] py-3.5 rounded-xl shadow-sm hover:bg-surface-container-low transition-colors active:scale-[0.98]">
            <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"></path>
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"></path>
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05"></path>
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"></path>
            </svg>
            Lanjutkan dengan Google
          </button>
          <button
            class="w-full flex items-center justify-center bg-inverse-surface text-inverse-on-surface font-body-md font-medium text-[15px] py-3.5 rounded-xl shadow-sm hover:bg-[#1a2635] transition-colors active:scale-[0.98]">
            <svg class="w-5 h-5 mr-3 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.19 2.24-.88 3.54-.84 1.77.1 3 .79 3.86 1.95-3.22 2.04-2.65 5.86.35 6.94-1 2.37-1.8 3.47-2.83 4.12zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.32 2.39-1.92 4.15-3.74 4.25z">
              </path>
            </svg>
            Lanjutkan dengan Apple
          </button>
        </div>
        <div class="mt-8 text-center">
          <p class="text-body-md text-text-body text-[14px]">
            Sudah punya akun?
            <a class="text-primary font-semibold hover:underline transition-all" href="#">Masuk Sekarang</a>
          </p>
        </div>
      </div>
      <div
        class="absolute inset-0 z-0 pointer-events-none opacity-40 mix-blend-multiply bg-gradient-to-tr from-primary-fixed/30 via-transparent to-secondary-fixed/20">
      </div>
    </div>
    <script>
      function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('.material-symbols-outlined');

        if (input.type === 'password') {
          input.type = 'text';
          icon.textContent = 'visibility';
        } else {
          input.type = 'password';
          icon.textContent = 'visibility_off';
        }
      }
    </script>
  </main>
</body>

</html>

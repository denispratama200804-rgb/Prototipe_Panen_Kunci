<!DOCTYPE html><html lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"></head><body class="bg-background font-body-md text-text-body pt-safe pb-safe"><main class="flex flex-col min-h-screen relative w-full"><div class="flex flex-col w-full px-margin-mobile min-h-screen bg-surface items-center justify-center py-xl relative overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute top-[-10%] right-[-10%] w-[300px] h-[300px] rounded-full bg-primary-container opacity-[0.03] blur-3xl pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[250px] h-[250px] rounded-full bg-secondary-container opacity-[0.04] blur-2xl pointer-events-none"></div>
<!-- Main Login Card -->
<div class="w-full max-w-[400px] bg-surface-card rounded-xl shadow-lg shadow-on-background/5 p-lg relative z-10">
<!-- Header -->
<div class="flex flex-col items-center mb-xl">
<img alt="Kie Catcher Logo" class="w-16 h-16 object-contain mb-md rounded-md shadow-sm" src="https://lh3.googleusercontent.com/aida/AEtjO1VIQyv-A6-etisnbpEGCuLFVYwgQQrFgJy2nbn3tbOL9udPLoIJOwFW1MQGrU8_wznbY1bWjdnibL8_xDCeTYvq3QxR22d1BhsL4ui3Aaxi_gI-UOZqMSqp8_vsy32WO0B2KUxTKgwG-UsGca-bXTAKaHmWJ4-K58MSuO6JGpZCOH3o7CtYtTcgy4Ys5-mOg0V0Ha4DTrFIdMKiBHpEEbo_AXG4i_lk6KlADFrZP2hY748BpOOaapIIZQ">
<h1 class="font-headline-md text-text-heading text-center">Selamat Datang Kembali</h1>
<p class="font-body-md text-text-body mt-xs text-center">Silakan masuk ke akun Panen Kunci Anda.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg w-full">
<!-- Email Field -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-text-heading uppercase tracking-wider" for="email">Email atau Username</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline-variant">person</span>
<input class="w-full bg-bg-subtle text-text-heading font-body-md rounded-lg py-md pl-[48px] pr-md focus:outline-none focus:ring-2 focus:ring-primary transition-shadow placeholder:text-outline-variant" id="email" placeholder="Masukkan email Anda" type="text">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<label class="font-label-sm text-text-heading uppercase tracking-wider" for="password">Kata Sandi</label>
<a class="font-label-md text-primary hover:text-primary-container transition-colors" href="#">Lupa Kata Sandi?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline-variant">lock</span>
<input class="w-full bg-bg-subtle text-text-heading font-body-md rounded-lg py-md pl-[48px] pr-[48px] focus:outline-none focus:ring-2 focus:ring-primary transition-shadow placeholder:text-outline-variant" id="password" placeholder="Masukkan kata sandi" type="password">
<button class="absolute right-md text-outline-variant hover:text-text-heading transition-colors" onclick="const p=document.getElementById('password'); p.type=p.type==='password'?'text':'password'; this.textContent=p.type==='password'?'visibility_off':'visibility';" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md rounded-lg py-md mt-sm hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-sm shadow-md shadow-primary/20" type="button">
<span class="">Masuk</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md my-xl w-full">
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
<span class="font-label-sm text-text-body uppercase tracking-wider">Atau masuk dengan</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<!-- Social Login -->
<div class="flex flex-col gap-md w-full">
<button class="w-full bg-surface-container text-text-heading font-label-md rounded-lg py-md flex items-center justify-center gap-md hover:bg-surface-container-highest transition-colors" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
        Lanjutkan dengan Google
      </button>
<button class="w-full bg-inverse-surface text-inverse-on-surface font-label-md rounded-lg py-md flex items-center justify-center gap-md hover:bg-[#1a2638] transition-colors" type="button">
<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.19 2.29-.88 3.56-.81 1.69.09 2.91.81 3.75 1.99-3.25 1.94-2.73 6.1.48 7.38-.85 1.4-1.6 2.53-2.87 3.61zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path></svg>
        Lanjutkan dengan Apple
      </button>
</div>
</div>
<!-- Footer -->
<div class="mt-lg z-10">
<p class="font-body-md text-text-body">Belum punya akun? <a class="font-label-md text-primary hover:text-primary-container transition-colors" href="#">Daftar Sekarang</a></p>
</div>
</div></main>  <script type="module" src="/src/main.js"></script>
</body></html>

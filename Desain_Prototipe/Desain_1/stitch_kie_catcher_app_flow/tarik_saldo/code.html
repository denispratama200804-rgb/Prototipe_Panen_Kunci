  </head><body class="bg-background text-on-surface font-body-md"><header class="fixed top-0 w-full z-50 glass shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin-mobile flex items-center pt-safe"><button class="w-10 h-10 -ml-2 flex items-center justify-center text-on-surface hover:bg-surface-container rounded-full transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="ml-2 font-headline-md text-headline-md">Transaksi Detail</h1></div></header><main class="relative pt-16 min-h-screen bg-background"><div class="px-margin-mobile py-lg"><div class="flex flex-col w-full gap-lg">

<div class="absolute -right-4 -top-4 w-24 h-24 bg-primary-fixed opacity-30 rounded-full blur-xl"></div>

<label class="text-label-md text-on-surface font-label-md">Nominal Penarikan</label>

<span class="absolute left-md top-1/2 -translate-y-1/2 text-headline-md text-on-surface-variant font-headline-md">Rp</span>

<button class="absolute right-sm top-1/2 -translate-y-1/2 bg-surface-container-low text-primary px-sm py-xs rounded-lg font-label-sm hover:bg-surface-container transition-colors">
        Tarik Semua
      </button>
</div>
<span class="text-label-sm text-error mt-xs hidden">Minimal penarikan Rp 50.000</span>
</div>
<!-- Method Selection -->
<div class="flex flex-col gap-sm">
<div class="flex items-center justify-between">
<label class="text-label-md text-on-surface font-label-md">Metode Pencairan</label>
<span class="text-label-sm text-primary cursor-pointer hover:underline">Lihat Semua</span>
</div>
<div class="grid grid-cols-2 gap-sm">
<!-- DANA Selected -->
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="withdrawal_method" type="radio">

<div class="w-12 h-12 bg-surface-container-lowest rounded-full flex items-center justify-center shadow-sm">
<span 'fill'="" 1;""="" class="material-symbols-outlined text-primary text-[28px] style=" font-variation-settings:="">account_balance_wallet</span>
</div>
<span class="font-label-md text-on-surface">DANA</span>
</div>
<!-- Active Checkmark -->
<div class="absolute top-2 right-2 w-5 h-5 bg-primary text-on-primary rounded-full flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[14px] font-bold">check</span>
</div>
</label>
<!-- GoPay -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="withdrawal_method" type="radio">

<div class="w-12 h-12 bg-surface-container-lowest rounded-full flex items-center justify-center shadow-sm">
<span 'fill'="" 1;""="" class="material-symbols-outlined text-[#00AED6] text-[28px] style=" font-variation-settings:="">account_balance_wallet</span>
</div>
<span class="font-label-md text-on-surface">GoPay</span>
</div>
<div class="absolute top-2 right-2 w-5 h-5 bg-primary text-on-primary rounded-full flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[14px] font-bold">check</span>
</div>
</label>
<!-- OVO -->

<div class="w-12 h-12 bg-surface-container-lowest rounded-full flex items-center justify-center shadow-sm">

</div>
<span class="font-label-md text-on-surface">OVO</span>
</div>
<div class="absolute top-2 right-2 w-5 h-5 bg-primary text-on-primary rounded-full flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[14px] font-bold">check</span>
</div>
</label>
<!-- Bank Transfer -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="withdrawal_method" type="radio">
<div class="bg-surface-card p-md rounded-xl shadow-sm flex flex-col items-center justify-center gap-sm peer-checked:ring-2 peer-checked:ring-primary peer-checked:bg-primary-fixed/20 transition-all hover:bg-surface-container-low">
<div class="w-12 h-12 bg-surface-container-lowest rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-tertiary-container text-[28px]">account_balance</span>
</div>
<span class="font-label-md text-on-surface text-center">Bank Transfer</span>
</div>
<div class="absolute top-2 right-2 w-5 h-5 bg-primary text-on-primary rounded-full flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[14px] font-bold">check</span>
</div>
</label>
</div>
</div>
<!-- Recipient Details -->
<div class="flex flex-col gap-sm">
<label class="text-label-md text-on-surface font-label-md">Nomor Handphone / Rekening</label>
<div class="relative w-full">
<div class="absolute left-md top-1/2 -translate-y-1/2 flex items-center text-outline">
<span class="material-symbols-outlined">phone_iphone</span>
</div>
<input class="w-full bg-surface-card rounded-xl py-md pl-12 pr-12 text-body-lg font-body-lg text-on-surface shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-shadow placeholder:text-outline-variant font-mono" placeholder="0812xxxxxxx" type="tel" value="081234567890">
<button class="absolute right-md top-1/2 -translate-y-1/2 flex items-center text-primary hover:text-primary-container transition-colors" title="Paste from clipboard">

</div>
<div class="flex items-center gap-xs mt-xs text-secondary bg-secondary-container/20 p-sm rounded-lg w-fit">

<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center text-body-md text-on-surface">
<span>Jumlah Penarikan</span>
<span class="font-medium font-mono">Rp 500.000</span>
</div>
<div class="flex justify-between items-center text-body-md text-on-surface">
<span>Biaya Admin</span>
<span class="text-secondary font-medium font-mono">Rp 0</span>
</div>
</div>
<div class="w-full h-px bg-surface-variant my-xs"></div>
<div class="flex justify-between items-center">
<span class="text-body-lg font-bold text-on-surface">Total Diterima</span>
<span class="text-headline-md font-headline-md text-primary">Rp 500.000</span>
</div>
</div>

<div class="mt-xl mb-xl">
<button class="w-full bg-secondary text-on-secondary py-md rounded-xl font-headline-md text-body-lg shadow-md hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-sm overflow-hidden relative group">
<span class="relative z-10 flex items-center gap-sm">
        Konfirmasi Penarikan
        <span class="material-symbols-outlined">arrow_forward</span>
</span>
<!-- Shine effect -->
<div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/20 to-transparent group-hover:animate-[shimmer_1.5s_infinite]"></div>
</button>
<p class="text-center text-label-sm text-outline mt-sm">Proses pencairan biasanya memakan waktu 1-5 menit.</p>
</div>
</div>
<style>
  @keyframes shimmer {

    }
  }

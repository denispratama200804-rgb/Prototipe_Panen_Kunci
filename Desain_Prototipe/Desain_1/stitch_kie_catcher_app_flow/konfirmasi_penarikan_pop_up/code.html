<div class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-40 transition-opacity duration-300" id="overlay"></div>

<div class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[calc(100%-32px)] max-w-sm bg-surface-card rounded-xl shadow-xl z-50 overflow-hidden scale-95 opacity-0 transition-all duration-300" id="modal-card">

<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-sm rounded-full" id="close-btn-top">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Content -->
<div class="p-lg space-y-md">
<div class="bg-surface-container-low rounded-lg p-md space-y-sm">
<!-- Nominal -->

</div>
<!-- Biaya Admin -->
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Biaya Admin</span>

</div>

</div>

<div class="w-10 h-10 rounded-full bg-surface-card shadow-sm flex items-center justify-center flex-shrink-0">

</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Tujuan</span>

</p>
</div>
<!-- Actions -->

<button class="flex-1 py-md px-lg rounded-lg font-label-md text-label-md text-primary bg-primary/10 hover:bg-primary/20 transition-colors" id="btn-cancel">
                Batal
            </button>
<button class="flex-[2] py-md px-lg rounded-lg font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-sm relative overflow-hidden group" id="btn-confirm">
<span class="relative z-10">Tarik Sekarang</span>
<span class="material-symbols-outlined text-[18px] relative z-10 transition-transform group-hover:translate-x-1">arrow_forward</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
</button>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const overlay = document.getElementById('overlay');
        const modalCard = document.getElementById('modal-card');
        const btnCancel = document.getElementById('btn-cancel');
        const btnConfirm = document.getElementById('btn-confirm');
        const btnCloseTop = document.getElementById('close-btn-top');

        // Animate in
        setTimeout(() => {
            modalCard.classList.remove('scale-95', 'opacity-0');
            modalCard.classList.add('scale-100', 'opacity-100');
        }, 50);

        const closeModal = () => {
            modalCard.classList.remove('scale-100', 'opacity-100');
            modalCard.classList.add('scale-95', 'opacity-0');
            overlay.classList.add('opacity-0');
            
            setTimeout(() => {
                document.getElementById('withdrawal-modal').style.display = 'none';
            }, 300);
        };

        const handleConfirm = () => {
            // Success state simulation
            btnConfirm.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span><span class="ml-2">Memproses...</span>';
            btnConfirm.classList.add('opacity-80', 'cursor-not-allowed');
            
            setTimeout(() => {
                btnConfirm.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span class="ml-2">Berhasil</span>';
                btnConfirm.classList.replace('bg-primary', 'bg-secondary');
                btnConfirm.classList.replace('hover:bg-primary-container', 'hover:bg-secondary-container');
                
                setTimeout(closeModal, 1000);
            }, 1500);
        };

        overlay.addEventListener('click', closeModal);
        btnCancel.addEventListener('click', closeModal);
        btnCloseTop.addEventListener('click', closeModal);
        btnConfirm.addEventListener('click', handleConfirm);
    });
</script></div></main><nav class="fixed bottom-0 w-full z-50 pb-safe glass" data-active-classes="text-primary font-bold"><div class="h-16 px-lg flex items-center justify-around"><a aria-current="page" class="flex flex-col items-center justify-center gap-xs transition-colors min-w-[64px] text-primary font-bold" data-path="dashboard" href="#"><span class="material-symbols-outlined">dashboard</span><span class="font-label-sm text-label-sm">Home</span></a><a class="flex flex-col items-center justify-center gap-xs text-on-surface-variant transition-colors min-w-[64px]" data-path="history" href="#"><span class="material-symbols-outlined">history</span><span class="font-label-sm text-label-sm">History</span></a><a class="flex flex-col items-center justify-center gap-xs text-on-surface-variant transition-colors min-w-[64px]" data-path="profile" href="#"><span class="material-symbols-outlined">person</span><span class="font-label-sm text-label-sm">Profile</span></a></div></nav></body></html>

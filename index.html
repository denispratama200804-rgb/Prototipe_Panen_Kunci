<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Panen Kunci</title>
  <meta name="description" content="Aplikasi Panen Kunci: Setorkan API Key valid dari Kie.ai dan dapatkan saldo yang bisa langsung dicairkan ke e-wallet favoritmu." />

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="/Logo_PK.jpg" />
  <link rel="shortcut icon" href="/Logo_PK.jpg" />

  <!-- PWA: Theme & Status Bar -->
  <meta name="theme-color" content="#00175c" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- PWA: iOS / Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PanenKunci" />
  <link rel="apple-touch-icon" href="/Logo_PK.jpg" />

  <!-- PWA: Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Open Graph -->
  <meta property="og:title" content="Panen Kunci" />
  <meta property="og:description" content="Setorkan API Key Kie.ai dan cairkan ke DANA, GoPay, OVO, atau Bank Transfer." />
  <meta property="og:image" content="/hero-illustration.jpg" />
  <meta property="og:type" content="website" />

  <!-- Google Fonts & Material Symbols Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Google Identity Services SDK (untuk Login Google langsung dengan nama Panen Kunci) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-background text-on-surface font-body-md select-none overflow-x-hidden antialiased">
  <!-- Application Root Mount -->
  <div id="app" class="relative w-full min-h-screen flex flex-col"></div>

  <!-- Entry Script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
